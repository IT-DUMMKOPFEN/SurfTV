name: Build SlaxxTV

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Version of the release that is created/updated from main.
  APP_VERSION: '1.1'

jobs:
  channels:
    name: Channel list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download + test all channels
        run: python3 tool/build_default_list.py assets/channels_default.json
      - uses: actions/upload-artifact@v4
        with:
          name: channel-list
          path: assets/channels_default.json

  build:
    name: ${{ matrix.name }}
    needs: channels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: windows
          - name: Linux
            os: ubuntu-latest
            target: linux
          - name: macOS-Silicon
            os: macos-latest
            target: macos
            mac: Silicon
          - name: macOS-Intel
            os: macos-15-intel
            target: macos
            mac: intel
          - name: Android
            os: ubuntu-latest
            target: apk

    steps:
      - uses: actions/checkout@v4

      - name: Shipped channel list
        uses: actions/download-artifact@v4
        with:
          name: channel-list
          path: assets

      - name: Java (Android)
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Linux packages
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv clang cmake pkg-config

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create + patch platform folders
        run: python3 tool/setup_platforms.py || python tool/setup_platforms.py
        shell: bash

      - name: Dependencies
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Build
        run: flutter build ${{ matrix.target }} --release

      - name: Package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/SlaxxTV-windows-x64.zip

      - name: Package (Linux)
        if: matrix.target == 'linux'
        run: |
          mkdir -p dist
          cp assets/icon/icon.png build/linux/x64/release/bundle/surftv.png
          tar -czf dist/SlaxxTV-linux-x64.tar.gz -C build/linux/x64/release bundle --transform 's/^bundle/SlaxxTV/'

      - name: Package (macOS)
        if: matrix.target == 'macos'
        run: |
          mkdir -p dist
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -n1)
          echo "Entitlements:"
          codesign -d --entitlements - "$APP" 2>/dev/null || true
          echo "Architectures:"
          lipo -archs "$APP/Contents/MacOS/"* || true
          find "$APP/Contents/Frameworks" -maxdepth 3 -type f -perm +111 | head -5 | while read f; do echo "$f: $(lipo -archs "$f" 2>/dev/null)"; done
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/SlaxxTV-macOS-${{ matrix.mac }}.zip

      - name: Package (Android)
        if: matrix.target == 'apk'
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SlaxxTV-android.apk
          # Smaller APKs per processor type (e.g. 32-bit TV boxes with Android 10)
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/SlaxxTV-android-arm32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/SlaxxTV-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/SlaxxTV-android-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SlaxxTV-${{ matrix.name }}
          path: dist/*

  release:
    name: GitHub Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SlaxxTV-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          target_commitish: ${{ github.sha }}
          name: SlaxxTV ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          make_latest: true
          body: |
            SlaxxTV - free internet TV from all over the world.
            Written by IT-Dummkopfen with the help of an AI.

            Downloads:
            - Windows: SlaxxTV-windows-x64.zip (unzip, start slaxxtv.exe)
            - macOS Apple Silicon (M1/M2/...): SlaxxTV-macOS-Silicon.zip
            - macOS Intel: SlaxxTV-macOS-intel.zip
              (both unsigned: right-click > Open the first time)
            - Linux: SlaxxTV-linux-x64.tar.gz (needs libmpv: sudo apt install libmpv2)
            - Android (all devices): SlaxxTV-android.apk
            - Android, smaller per processor type:
              SlaxxTV-android-arm32.apk (older phones, many TV boxes, Android 10),
              SlaxxTV-android-arm64.apk (most current phones),
              SlaxxTV-android-x86_64.apk (emulators, some boxes)
          files: dist/*
