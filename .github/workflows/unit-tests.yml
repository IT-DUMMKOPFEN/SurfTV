name: Unit tests (real data)

on:
  push:
    branches: [ci-android-test]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/youtube_debug_test.dart --reporter expanded || true
      - run: flutter test test/youtube_test.dart --reporter expanded || true
