name: surftv
description: "SlaxxTV - watch free-to-air internet TV channels from all over the world. Written by IT-Dummkopfen with the help of an AI."
publish_to: 'none'
version: 1.0.0+10

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  window_manager: ^0.4.3
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  http: ^1.2.2
  file_picker: ">=10.3.3 <11.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/channels_default.json
    - assets/tv_background.jpg
    - assets/own.png

# App icon: a TV with a surfboard gliding on a wave.
# Generate with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: false
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
